<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>og-image source</title>
<link rel="stylesheet" href="../fonts.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px;
    background: #16130F;
    background-image: radial-gradient(110% 80% at 82% -15%, rgba(217,174,104,.20), transparent 62%);
    color: #F2ECE0;
    font-family: 'Montserrat', sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 74px 84px;
    box-sizing: border-box;
  }
  .eyebrow {
    font-size: 19px; letter-spacing: .24em; text-transform: uppercase;
    font-weight: 600; color: #D9AE68; display: flex; align-items: center; gap: 22px;
  }
  .eyebrow::before { content: ""; width: 64px; height: 1px; background: #D9AE68; }
  h1 {
    font-family: 'Cormorant Garamond', serif; font-weight: 300;
    font-size: 126px; line-height: .92; letter-spacing: -.02em; margin: 0;
  }
  h1 em { font-style: italic; display: block; margin-left: 62px; }
  .foot {
    display: flex; justify-content: space-between; align-items: flex-end;
    border-top: 1px solid rgba(242,236,224,.20); padding-top: 26px;
  }
  .claim { font-family: 'Cormorant Garamond', serif; font-size: 34px; color: #F2ECE0; max-width: 620px; line-height: 1.25; }
  .claim b { font-style: italic; font-weight: 600; color: #D9AE68; }
  .where { font-size: 17px; letter-spacing: .14em; text-transform: uppercase; color: #B5AC9B; text-align: right; line-height: 2; }
</style>
</head>
<body>
  <p class="eyebrow">Medicina e Chirurgia Estetica</p>
  <h1>Roberto<em>Dell'Avanzato</em></h1>
  <div class="foot">
    <p class="claim">Dal 2005 la metodica <b>Endolift®</b>,<br>codificata e sviluppata in prima persona.</p>
    <p class="where">Milano<br>Erbusco · Franciacorta</p>
  </div>
</body>
</html>
