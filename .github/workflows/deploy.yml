name: Deploy su GitHub Pages

on:
  push:
    # il branch di lavoro pubblica la demo prima del merge: serve un link
    # condivisibile per l'outreach
    branches: [main, claude/surgeon-website-redesign-ok7yit]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Build (export statico)
        env:
          # su Pages il sito vive sotto /DrRobDemo
          BASE_PATH: /DrRobDemo
          NEXT_PUBLIC_SITE_URL: https://sampoai67.github.io/DrRobDemo
          NEXT_PUBLIC_W3F_KEY: ${{ secrets.W3F_ACCESS_KEY }}
        run: npm run build

      - name: Disattiva Jekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
