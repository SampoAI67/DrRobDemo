name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build with Next.js
        env:
          NEXT_PUBLIC_BASE_PATH: "/DrRobDemo"
          # Senza questo, canonical e og:image restano sul dominio di produzione
          # (il default in lib/metadata.ts) e l'anteprima social della demo esce
          # senza immagine, perche' quel file li' non esiste ancora.
          NEXT_PUBLIC_SITE_URL: "https://sampoai67.github.io/DrRobDemo"
          # NEXT_PUBLIC_CONTACT_ENDPOINT non e' impostata: il modulo contatti
          # ripiega sul programma di posta dell'utente e lo dichiara in pagina.
          # Quando c'e' un endpoint, va aggiunta qui e il modulo cambia da solo
          # etichette, conferma e nota sui dati.
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
